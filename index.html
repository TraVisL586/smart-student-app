function renderMarkdown(text){
  if(!text)return '';
  let src=String(text);
  const codeBlocks=[];
  src=src.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g,(match,lang,code)=>{
    const id='%%CODEBLOCK'+codeBlocks.length+'%%';
    codeBlocks.push('<pre class="md-code"><div class="code-header">'+esc(lang||'code')+'</div><code>'+esc(code.trim())+'</code></pre>');
    return id;
  });
  const inlineCodes=[];
  src=src.replace(/`([^`\n]+)`/g,(match,code)=>{
    const id='%%INLINECODE'+inlineCodes.length+'%%';
    inlineCodes.push('<code class="md-inline-code">'+esc(code)+'</code>');
    return id;
  });
  const mathBlocks=[];
  function saveMath(math, isDisplay){
    const id='%%MATHBLOCK'+mathBlocks.length+'%%';
    let html='';
    if(window.katex){
      try{
        html=window.katex.renderToString(math,{displayMode:isDisplay,throwOnError:false});
      }catch(e){
        html=isDisplay?`<div class="katex-display">\\[${esc(math)}\\]</div>`:`<span class="katex-inline">\\(${esc(math)}\\)</span>`;
      }
    }else{
      html=isDisplay?`<div class="katex-display">\\[${esc(math)}\\]</div>`:`<span class="katex-inline">\\(${esc(math)}\\)</span>`;
    }
    mathBlocks.push(html);
    return id;
  }
  src=src.replace(/\\\[([\s\S]*?)\\\]/g,(m,c)=>saveMath(c.trim(),true));
  src=src.replace(/\$\$([\s\S]*?)\$\$/g,(m,c)=>saveMath(c.trim(),true));
  src=src.replace(/\\begin\{(aligned|align|gather|cases|matrix|pmatrix|bmatrix|vmatrix)\}([\s\S]*?)\\end\{\1\}/g,(m)=>saveMath(m.trim(),true));
  src=src.replace(/\\\(([\s\S]*?)\\\)/g,(m,c)=>saveMath(c.trim(),false));
  src=src.replace(/(^|[^\\])\$([^\$\n]+?)\$/g,(m,pre,c)=>pre+saveMath(c.trim(),false));

  function inlineFormat(str){
    if(!str)return '';
    let s=esc(str);
    s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/__(.+?)__/g,'<strong>$1</strong>');
    s=s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
    s=s.replace(/_([^_\n]+)_/g,'<em>$1</em>');
    return s;
  }
  const lines=src.split('\n');
  const processedLines=[];
  let tableBuffer=[];
  function flushTable(){
    if(tableBuffer.length===0)return;
    if(tableBuffer.length>=2){
      const headerLine=tableBuffer[0];
      const sepLine=tableBuffer[1];
      if(sepLine.includes('---')||sepLine.includes('-|-')||/\|[\s:-]+\|/.test(sepLine)){
        const splitRow=line=>{
          let parts=line.split('|').map(s=>s.trim());
          if(parts[0]==='')parts.shift();
          if(parts.length&&parts[parts.length-1]==='')parts.pop();
          return parts;
        };
        const headers=splitRow(headerLine);
        const rows=tableBuffer.slice(2).map(splitRow);
        let tableHtml='<div class="md-table-wrap"><table class="md-table"><thead><tr>';
        headers.forEach(h=>{tableHtml+='<th>'+inlineFormat(h)+'</th>';});
        tableHtml+='</tr></thead><tbody>';
        rows.forEach(r=>{
          if(r.length===0)return;
          tableHtml+='<tr>';
          r.forEach(c=>{tableHtml+='<td>'+inlineFormat(c||'')+'</td>';});
          tableHtml+='</tr>';
        });
        tableHtml+='</tbody></table></div>';
        processedLines.push(tableHtml);
        tableBuffer=[];
        return;
      }
    }
    tableBuffer.forEach(l=>processedLines.push(l));
    tableBuffer=[];
  }
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(line.startsWith('|')&&line.endsWith('|')){
      tableBuffer.push(line);
    }else{
      flushTable();
      processedLines.push(lines[i]);
    }
  }
  flushTable();
  let out=[];
  let inList=false;
  let listType='ul';
  function closeList(){
    if(inList){out.push(listType==='ul'?'</ul>':'</ol>');inList=false;}
  }
  for(let rawLine of processedLines){
    if(rawLine.startsWith('<div class="md-table-wrap">')){
      closeList();out.push(rawLine);continue;
    }
    const trimmed=rawLine.trim();
    if(!trimmed){closeList();continue;}
    if(/^%%MATHBLOCK\d+%%$/.test(trimmed)){
      closeList();out.push(trimmed);
    }else if(trimmed.startsWith('### ')){
      closeList();out.push('<h4 class="md-h4">'+inlineFormat(trimmed.slice(4))+'</h4>');
    }else if(trimmed.startsWith('## ')){
      closeList();out.push('<h3 class="md-h3">'+inlineFormat(trimmed.slice(3))+'</h3>');
    }else if(trimmed.startsWith('# ')){
      closeList();out.push('<h2 class="md-h2">'+inlineFormat(trimmed.slice(2))+'</h2>');
    }else if(trimmed.startsWith('> ')){
      closeList();out.push('<blockquote class="md-quote">'+inlineFormat(trimmed.slice(2))+'</blockquote>');
    }else if(/^[-*•]\s+/.test(trimmed)){
      if(!inList||listType!=='ul'){closeList();out.push('<ul class="md-ul">');inList=true;listType='ul';}
      out.push('<li>'+inlineFormat(trimmed.replace(/^[-*•]\s+/,''))+'</li>');
    }else if(/^\d+\.\s+/.test(trimmed)){
      if(!inList||listType!=='ol'){closeList();out.push('<ol class="md-ol">');inList=true;listType='ol';}
      out.push('<li>'+inlineFormat(trimmed.replace(/^\d+\.\s+/,''))+'</li>');
    }else{
      closeList();out.push('<p class="md-p">'+inlineFormat(trimmed)+'</p>');
    }
  }
  closeList();
  let result=out.join('');
  codeBlocks.forEach((b,i)=>{result=result.replaceAll('%%CODEBLOCK'+i+'%%',b);});
  inlineCodes.forEach((c,i)=>{result=result.replaceAll('%%INLINECODE'+i+'%%',c);});
  mathBlocks.forEach((m,i)=>{result=result.replaceAll('%%MATHBLOCK'+i+'%%',m);});
  return result;
}

function formatText(s,id){
  if(!id)id='m_'+Math.random().toString(36).slice(2,9);
  window.msgStore[id]=s;
  const rendered=renderMarkdown(s);
  if(window.renderMathInElement){
    setTimeout(()=>{
      const el=document.getElementById('render_'+id);
      if(el){
        try{
          renderMathInElement(el,{
            delimiters:[
              {left:'$$',right:'$$',display:true},
              {left:'\\[',right:'\\]',display:true},
              {left:'\\(',right:'\\)',display:false},
              {left:'$',right:'$',display:false}
            ],
            throwOnError:false
          });
        }catch(e){}
      }
    },40);
  }
  return `<div class="ai-msg-body" id="render_${id}">${rendered}</div><div class="ai-msg-raw" id="raw_${id}" style="display:none;white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px;background:#18322d;color:#edf8f4;padding:12px;border-radius:10px;margin:8px 0;line-height:1.5;overflow:auto;">${esc(s)}</div><div class="bubble-tools"><button onclick="toggleMsgView('${id}')" id="viewBtn_${id}">👁️ Xem dạng thô</button><button onclick="copyMsg('${id}')">📋 Sao chép</button></div>`;
}

function toggleMsgView(id){
  const r=document.getElementById('render_'+id);
  const raw=document.getElementById('raw_'+id);
  const btn=document.getElementById('viewBtn_'+id);
  if(!r||!raw)return;
  if(raw.style.display==='none'){
    raw.style.display='block';r.style.display='none';
    if(btn)btn.innerHTML='✨ Xem định dạng Preview';
  }else{
    raw.style.display='none';r.style.display='block';
    if(btn)btn.innerHTML='👁️ Xem dạng thô';
  }
}

function copyMsg(id){
  const text=window.msgStore[id]||'';
  if(!text)return;
  navigator.clipboard.writeText(text).then(()=>{toast('Đã sao chép vào bộ nhớ tạm!')}).catch(()=>{toast('Không thể sao chép')});
}

async function callAI(message,course=currentSubject){const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,course})});const d=await r.json();if(!r.ok)throw new Error(d.error||'AI unavailable');return d.answer||''}

async function sendAI(){const inp=document.getElementById('aiInput');if(!inp||!inp.value.trim())return;const q=inp.value.trim(),course=document.getElementById('aiCourse')?.value||currentSubject,box=document.getElementById('messages');box.insertAdjacentHTML('beforeend',`<div class="bubble me">${esc(q)}</div><div class="bubble ai" id="typing">⏳ Smart AI đang suy nghĩ...</div>`);inp.value='';box.scrollTop=box.scrollHeight;let ans;try{ans=await callAI(q,course)}catch{ans=localAI(q,course)}document.getElementById('typing')?.remove();const id=Date.now().toString();box.insertAdjacentHTML('beforeend',`<div class="bubble ai"><b>Smart AI:</b><br>${formatText(ans, id)}</div>`);state.chatHistory.push({id,title:q.slice(0,42),date:new Date().toISOString(),course,question:q,answer:ans});save();box.scrollTop=box.scrollHeight;toast('Đã lưu lịch sử trò chuyện')}

function localAI(q,course){let x=q.toLowerCase();if(x.includes('trắc nghiệm')||x.includes('10 câu'))return `Mình có thể tạo 10 câu theo môn ${course}, mỗi câu gồm A, B, C, D và đáp án. Hãy bấm “Tạo 10 câu trắc nghiệm” để vào chế độ làm bài.`;if(x.includes('kế hoạch'))return `Kế hoạch ${course}: 7:15–10:00 học nội dung mới; 14:00–15:00 luyện bài; 20:00–20:30 ôn bằng active recall. Chia phiên 25–50 phút, nghỉ 5–10 phút.`;if(course==='Kinh tế vi mô'&&x.includes('cầu'))return 'Cầu thể hiện lượng hàng hóa người mua sẵn sàng và có khả năng mua ở các mức giá khác nhau. Khi các yếu tố khác không đổi, giá tăng thường làm lượng cầu giảm.';if(course==='Toán ứng dụng'&&x.includes('đạo hàm'))return 'Đạo hàm biểu diễn tốc độ thay đổi tức thời của hàm số. Khi f′(x)>0 trên một khoảng, f thường tăng trên khoảng đó.';if(course==='Tiếng Anh tổng quát'&&x.includes('thì'))return 'Hãy bắt đầu bằng dấu hiệu nhận biết và cấu trúc. Ví dụ hiện tại hoàn thành dùng have/has + V3, thường liên quan trải nghiệm hoặc hành động bắt đầu trong quá khứ còn liên quan hiện tại.';if(course==='Luật kinh doanh')return 'Khi học Luật kinh doanh, hãy tách vấn đề thành chủ thể – quyền/nghĩa vụ – điều kiện áp dụng – hậu quả pháp lý và dùng sơ đồ để ghi nhớ.';return `Mình đang ở chế độ demo nên chưa kết nối máy chủ AI. Với ${course}, hãy đặt câu hỏi cụ thể; khi cấu hình OPENAI_API_KEY, Smart AI sẽ trả lời bằng mô hình AI thật.`}

function checkEssay(){const text=document.getElementById('essayText').value.trim();if(!text)return toast('Hãy nhập bài viết');let issues=[];if(text.length<180)issues.push(['red','Bài viết còn ngắn','Bổ sung luận điểm, dẫn chứng và phần kết luận.']);if(!/[.!?]/.test(text))issues.push(['red','Thiếu dấu câu','Tách câu và bổ sung dấu chấm, dấu phẩy phù hợp.']);if(text.split(/\s+/).length>150&&!text.includes('tuy nhiên'))issues.push(['yellow','Liên kết ý','Thử dùng “tuy nhiên”, “do đó”, “mặt khác” để chuyển ý.']);if(/rất rất|cực kỳ rất/i.test(text))issues.push(['yellow','Lặp từ','Giảm từ nhấn mạnh liên tiếp.']);if(!text.match(/mở đầu|kết luận|tóm lại/i))issues.push(['yellow','Cấu trúc','Nên có mở bài – thân bài – kết luận rõ ràng.']);const score=Math.max(0,100-issues.length*12);document.getElementById('essayResult').innerHTML=`<div class="card"><b>Mức độ hoàn thiện: ${score}%</b><div class="progress" style="margin:9px 0"><span style="width:${score}%"></span></div>${issues.map(x=>`<div class="list-card"><span class="chip ${x[0]==='red'?'priority-high':x[0]==='yellow'?'priority-med':'priority-low'}">${x[0]==='red'?'🔴':x[0]==='yellow'?'🟡':'🟢'}</span><div style="flex:1"><b>${x[1]}</b><div class="small muted">${x[2]}</div></div></div>`).join('')||'<div class="notice">Không phát hiện lỗi cơ bản trong bản demo. Hãy tiếp tục kiểm tra lập luận và nguồn trích dẫn.</div>'}</div>`}
function openAIPercent(){showModal(`<h2>🧪 Check phần trăm AI</h2><p class="muted">Đây là chỉ số ước tính trong prototype, không phải kết luận chắc chắn về nguồn gốc văn bản.</p><textarea id="aiText" rows="10" style="width:100%" placeholder="Dán bài viết vào đây..."></textarea><div class="toolbar"><button class="btn" onclick="estimateAI()">Phân tích</button></div><div id="aiPercentResult"></div>`)}
function estimateAI(){const text=document.getElementById('aiText').value.trim();if(!text)return;const sentences=text.split(/[.!?]+/).filter(Boolean),avg=sentences.length?sentences.reduce((a,s)=>a+s.trim().split(/\s+/).length,0)/sentences.length:0;let pct=Math.min(92,Math.max(4,Math.round(25+(avg>24?25:0)+(sentences.length>8?12:0)+(text.includes('do đó')?7:0))));document.getElementById('aiPercentResult').innerHTML=`<div class="card"><div class="radial" style="--p:${pct};--c:${pct>70?'#e05a62':pct>40?'#f4c95d':'#0f8b72'}"><b>${pct}%</b></div><p class="small muted">Ước tính dựa trên một số đặc trưng văn bản trong bản demo. Không nên dùng một mình để kết luận đạo văn hay gian lận.</p></div>`}
function openAnalysis(){const s=analysisData();showModal(`<h2>📊 Phân tích năng lực</h2><p class="muted">Đánh giá theo dữ liệu game, bài tự kiểm tra và điểm bạn nhập. Các chỉ số có thể thay đổi khi bạn học.</p><div class="analysis-grid">${s.map(x=>`<div class="card strength-card" onclick="showSubjectAdvice('${x.subject}')"><div class="small muted">${x.subject}</div><div class="radial" style="--p:${x.score};--c:${x.color}"><b>${x.score}%</b></div><b>${x.level}</b></div>`).join('')}</div><div class="notice" style="margin-top:14px">Bấm vào từng môn để xem điểm mạnh, điểm cần cải thiện và phương pháp học.</div>`)}

function analysisData(){return SUBJECTS.map((s,i)=>{let bonus=Math.min(15,(state.gameHistory.filter(x=>x.subject===s).length*2));let score=Math.min(98,baseScores[s]+bonus);return {subject:s,score,level:score>=80?'Vững vàng':score>=70?'Khá':score>=60?'Đang phát triển':'Cần củng cố',color:score>=80?'#0f8b72':score>=70?'#f4a641':score>=60?'#f4c95d':'#e05a62'}})}

'Kinh tế vi mô':['Mạnh: đọc đồ thị và liên hệ tình huống.','Cải thiện: luyện bài tính độ co giãn, cân bằng thị trường.','Phương pháp: Feynman + Practice Testing + flashcard.'],
'Toán ứng dụng':['Mạnh: tư duy logic.','Cải thiện: kiểm tra từng bước biến đổi.','Phương pháp: Pomodoro + Interleaving + Error Log.'],
'Tiếng Anh tổng quát':['Mạnh: học theo ngữ cảnh.','Cải thiện: duy trì đều từ vựng và viết.','Phương pháp: Spaced Repetition + Shadowing + Active Recall.'],
'Luật kinh doanh':['Mạnh: ghi nhớ cấu trúc.','Cải thiện: áp dụng vào tình huống thực tế.','Phương pháp: Case Method + Feynman + Mind Mapping.'],
'Tư duy thiết kế':['Mạnh: sáng tạo và đồng cảm.','Cải thiện: prototype nhanh và kiểm chứng.','Phương pháp: Mind Mapping + Design Sprint + Reflection.']};const a=tips[s];showModal(`<h2>${s}</h2><div class="grid g3"><div class="card"><b>💪 Điểm mạnh</b><p>${a[0]}</p></div><div class="card"><b>🎯 Cần cải thiện</b><p>${a[1]}</p></div><div class="card"><b>🧠 Phương pháp</b><p>${a[2]}</p></div></div><div style="text-align:right;margin-top:14px"><button class="btn" onclick="hideModal()">Đóng</button></div>`) }

function calendarTab(type,btn){calendarView=type;if(btn){btn.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}const p=document.getElementById('calendarPanel');if(!p)return;if(type==='schedule'){const days=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];p.innerHTML=`<div class="card"><div class="pink-head">Các MH Chưa Xếp / Không Xếp TKB</div><div class="class-row"><div>Tên lớp</div><div class="name">Phí Bảo hiểm Y tế và tai nạn</div><div>—</div><div>Không xếp TKB</div></div><div class="pink-head">Thời Khóa Biểu Học Tập</div>${days.map(d=>{let a=state.schedules.filter(x=>x.day===d);return a.length?`<div class="day-block"><div class="day-head">${d}</div>${a.map(x=>`<div class="class-row"><div>Tên lớp</div><div class="name">${esc(x.subject)}</div><div>${esc(x.time)}</div><div>${esc(x.room)} · ${esc(x.teacher)}<br><span class="small muted">${esc(x.date||'')}</span><br><button class="btn ghost" style="margin-top:6px" onclick="removeCalendar('schedule',${state.schedules.indexOf(x)})">Xóa</button></div></div>`).join('')}</div>`:''}).join('')}</div>`}else if(type==='exam'){p.innerHTML=`<div class="card">${state.exams.map((x,i)=>`<div class="list-card"><div><b>${esc(x.subject)}</b><div class="small muted">${esc(x.date)} · ${esc(x.time)} · ${esc(x.room)} · ${esc(x.teacher)}</div></div><button class="btn ghost" onclick="removeCalendar('exam',${i})">Xóa</button></div>`).join('')||'<div class="notice">Chưa có lịch thi. Hãy thêm lịch thi.</div>'}</div>`}else{p.innerHTML=`<div class="card">${state.deadlines.map((x,i)=>`<div class="list-card"><div><b>${esc(x.title)}</b><div class="small muted">${esc(x.subject)} · hạn ${esc(x.date)} · ${esc(x.priority)}</div></div><button class="btn ghost" onclick="removeCalendar('deadline',${i})">Xóa</button></div>`).join('')||'<div class="notice">Chưa có deadline.</div>'}</div>`}}

function saveCalendar(type){const g=id=>document.getElementById(id)?.value.trim()||'';if(type==='schedule'){const subject=g('fSubject'),day=g('fDay'),date=g('fDate'),time=g('fTime'),room=g('fRoom'),teacher=g('fTeacher');if(!subject||!day||!date||!time||!room||!teacher)return toast('Vui lòng nhập đủ môn, thứ, ngày, giờ, phòng và giáo viên');state.schedules.push({subject,day,date,time,room,teacher})}else if(type==='exam'){const subject=g('fSubject'),date=g('fDate'),time=g('fTime'),room=g('fRoom'),teacher=g('fTeacher');if(!subject||!date||!time||!room||!teacher)return toast('Vui lòng nhập đủ thông tin lịch thi');state.exams.push({subject,date,time,room,teacher})}else{const title=g('fTitle'),subject=g('fSubject'),date=g('fDate'),priority=g('fPriority');if(!title||!subject||!date)return toast('Vui lòng nhập tên deadline, môn và hạn nộp');state.deadlines.push({title,subject,date,priority})}save();hideModal();go('calendar');setTimeout(()=>calendarTab(type,null),0);toast('✅ Đã lưu và cập nhật lịch')}
function removeCalendar(type,i){if(type==='schedule')state.schedules.splice(i,1);else if(type==='exam')state.exams.splice(i,1);else state.deadlines.splice(i,1);save();renderCalendar()}

function renderMaterials(){document.getElementById('content').innerHTML=`<div class="page">${homeBack()}<h1 class="page-title">Bài giảng & Tài liệu</h1><p class="muted">Chọn môn → chọn giảng viên/kênh YouTube → xem đúng nguồn bài giảng tương ứng; tài liệu được tổng hợp từ các nguồn tham khảo công khai và liên kết tới Studocu khi phù hợp.</p><div class="subject-tabs">${SUBJECTS.map(s=>`<button class="${s===currentSubject?'active':''}" onclick="currentSubject='${s}';renderMaterials()">${s}</button>`).join('')}</div><div class="toolbar"><select id="teacherFilter" onchange="renderMaterialsCards()"><option value="all">Tất cả giảng viên</option>${SUBJECT_TEACHERS[currentSubject].map(x=>`<option>${x}</option>`).join('')}</select><input id="matSearch" class="input" placeholder="🔎 Tìm bài giảng..." oninput="renderMaterialsCards()"></div><div class="tabs"><button class="active" onclick="materialsTab('videos',this)">🎬 Bài giảng</button><button onclick="materialsTab('exams',this)">📝 Đề thi các năm</button><button onclick="materialsTab('selftest',this)">🧪 File tự kiểm tra</button><button onclick="materialsTab('live',this)">🔴 Live bài giảng</button></div><div id="materialsPanel"></div></div>`;renderMaterialsCards()}
function renderMaterialsCards(){const teacher=document.getElementById('teacherFilter')?.value||'all',q=(document.getElementById('matSearch')?.value||'').toLowerCase(),arr=(materialVideos[currentSubject]||[]).filter(x=>(teacher==='all'||x.teacher===teacher)&&(x.title+' '+(x.teacher||'')+' '+(x.channel||'')).toLowerCase().includes(q));document.getElementById('materialsPanel').innerHTML=`<div class="section-title"><h3>🎬 Video bài giảng · ${currentSubject}</h3><span class="small muted">Phân loại theo tên người giảng được xác định từ nguồn YouTube/nguồn học thuật liên kết.</span></div><div class="video-grid">${arr.map(v=>`<div class="card"><div class="video-thumb"><a href="${v.url}" target="_blank" rel="noopener" style="display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(135deg,#dff3ec,#eef8f5);font-size:44px">▶️</a></div><h3 style="font-size:15px">${esc(v.title)}</h3><span class="chip">👨‍🏫 ${esc(v.teacher)}</span><span class="chip" style="margin-top:6px">📺 ${esc(v.channel||'YouTube')}</span><div class="small muted" style="margin-top:7px">${v.searchOnly?'🔎 YouTube được lọc theo đúng tên người giảng':'✅ Video YouTube có tên người giảng trong tiêu đề/nguồn'}</div>${v.note?`<div class="source-note">${esc(v.note)}</div>`:''}<a class="yt-link" href="${v.url}" target="_blank" rel="noopener">▶ Xem / tìm trên YouTube ↗</a></div>`).join('')||'<div class="notice">Không có video khớp bộ lọc.</div>'}</div><div class="section-title"><h3>📂 File & nguồn tài liệu tham khảo</h3></div><div class="resource-grid">${(materialResources[currentSubject]||[]).map(r=>`<div class="card resource-card"><div class="resource-icon">${r[0]}</div><b>${esc(r[1])}</b><div class="small muted">${esc(r[2])}</div><a href="${r[3]}" target="_blank" rel="noopener">Mở nguồn tài liệu ↗</a><div class="source-note">Smart Student chỉ liên kết tới nguồn tham khảo; hãy kiểm tra quyền truy cập và bản quyền của từng tài liệu.</div></div>`).join('')}</div>`}
function materialsTab(type,btn){btn.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const p=document.getElementById('materialsPanel');if(type==='videos'){renderMaterialsCards();return}if(type==='live'){const v=liveVideos[currentSubject];p.innerHTML=`<div class="card live-card"><div class="row"><div><h3>🔴 Live bài giảng · ${esc(currentSubject)}</h3><p class="muted">Nguồn live/phát lại từ YouTube, lọc đúng theo môn học và kênh.</p></div><span class="chip">👨‍🏫 ${esc(v.teacher)}</span><span class="chip">📺 ${esc(v.channel||'YouTube')}</span></div><div class="grid g2" style="margin-top:12px"><div class="video-thumb" style="min-height:250px"><div style="text-align:center;padding:25px"><div style="font-size:60px">🔴▶️</div><b>${esc(v.title)}</b><div class="small muted" style="margin-top:6px">Mở danh sách live/phát lại trên YouTube</div></div></div><div class="card"><h3>📡 Nguồn live</h3><p class="small muted">Giảng viên: <b>${esc(v.teacher)}</b> · Nguồn: <b>${esc(v.channel||'YouTube')}</b></p><a class="btn" href="${v.url}" target="_blank" rel="noopener">Mở live trên YouTube ↗</a></div></div></div>`;return}if(type==='exams'){p.innerHTML=`<div class="grid g3">${[2023,2024,2025].map(y=>`<div class="card"><h3>Đề ${currentSubject} ${y}</h3><p class="small muted">Bộ đề luyện tập theo chủ đề môn học.</p><button class="btn" onclick="startQuiz('${currentSubject}','Đề mô phỏng ${y}')">Mở đề luyện</button></div>`).join('')}</div>`}else{p.innerHTML=`<div class="card"><h3>🧪 Tự kiểm tra – ${currentSubject}</h3><p class="muted">10 câu → trả lời → nộp → chấm điểm → giải thích câu sai.</p><button class="btn" onclick="startQuiz('${currentSubject}','Tự kiểm tra')">Bắt đầu</button></div>`}}

function renderQuizQuestion(){const q=quiz.qs[quiz.index];clearInterval(timer);let left=30;showModal(`<div class="row"><div><span class="chip">${esc(quiz.subject)}</span><h2 style="margin:8px 0">${esc(quiz.title)}</h2></div><b id="qTimer">00:30</b></div><div class="progress"><span style="width:${quiz.index/10*100}%"></span></div><p><b>Câu ${quiz.index+1}/10.</b> ${esc(q[0])}</p><div class="answers">${q[1].map((a,i)=>`<button class="answer" onclick="answerQuiz(${i})"><b>${'ABCD'[i]}.</b> ${esc(a)}</button>`).join('')}</div><div id="qFeedback"></div>`);timer=setInterval(()=>{left--;const e=document.getElementById('qTimer');if(e)e.textContent=`00:${String(Math.max(0,left)).padStart(2,'0')}`;if(left<=0){clearInterval(timer);answerQuiz(-1)}},1000)}
function answerQuiz(i){if(quiz.answered)return;quiz.answered=true;clearInterval(timer);const q=quiz.qs[quiz.index],correct=i===q[2];if(correct)quiz.score++;document.querySelectorAll('.answer').forEach((b,j)=>{if(j===q[2])b.classList.add('correct');if(j===i&&j!==q[2])b.classList.add('wrong')});const chosen=i>=0?q[1][i]:'Hết thời gian';const analysis=gameAbilityReport(quiz.subject,quiz.score,quiz.index+1);document.getElementById('qFeedback').innerHTML=`<div class="notice"><b>${correct?'✅ Chính xác!':'❌ Chưa đúng / hết giờ.'}</b><br>Đáp án chính xác: <b>${'ABCD'[q[2]]}. ${esc(q[1][q[2]])}</b><br>${esc(q[3])}<div class="small muted" style="margin-top:8px">Lỗi: ${correct?'Không có lỗi ở câu này.':`Bạn chọn: ${esc(chosen)}.`} · Mức hiện tại: <b>${analysis.level}</b></div><div style="margin-top:9px;text-align:right"><button class="btn" onclick="nextQuiz()">${quiz.index===9?'Xem kết quả':'Câu tiếp theo →'}</button></div></div>`}
function nextQuiz(){if(quiz.index>=9){finishQuiz();return}quiz.index++;quiz.answered=false;renderQuizQuestion()}
function finishQuiz(){clearInterval(timer);const xp=quiz.score*10+20,coins=quiz.score*5+10;addReward(coins,xp,'quiz',quiz.subject,quiz.score);showModal(`<div style="text-align:center"><div style="font-size:60px">🎉</div><h2>Hoàn thành ${esc(quiz.title)}</h2><div class="metric">${quiz.score}/10</div><p>+${coins} xu · +${xp} XP</p><div class="notice">${quiz.score>=8?'Bạn đã nắm khá chắc kiến thức. Hãy tiếp tục bằng bài khó hơn.':'Xem lại câu sai và thử lại sau khi ôn bằng Feynman + Active Recall.'}</div><button class="btn" style="margin-top:13px" onclick="hideModal();go('games')">Về Game Center</button></div>`)}
function addReward(coins,xp,type,subject,score){state.coins+=coins;state.totalXp+=xp;const lv=getLevel();state.level=lv.level;state.gameHistory.push({date:new Date().toISOString(),type,subject,score,coins,xp});state.studyLogs.push({date:today(),minutes:Math.min(120,20+score*5),subject});save();toast(`+${coins} xu · +${xp} XP`)}
function getLevel(){let level=1;for(let i=1;i<levelXp.length;i++){if(state.totalXp>=levelXp[i])level=i+1}level=Math.min(5,level);const current=levelXp[level-1],next=levelXp[level]||levelXp[5];return {level,name:levelNames[level-1],current,next,pct:Math.min(100,Math.round((state.totalXp-current)/(next-current)*100))}}

ss="bottom"><span class="coin">🪙 +xu · ⭐ +XP</span><button class="btn" style="width:100%;margin-top:9px" onclick="playGame('${g[3]}')">Chơi ngay</button></div></div>`).join('')}</div><div class="section-title"><h3>🎁 Đổi quà UEH</h3></div><div class="reward-grid" id="rewardSection">${rewards.map((r,i)=>`<div class="reward card"><img src="${r.img}" alt="${esc(r.name)}"><h4>${r.name}</h4><div class="small muted">${r.desc}</div><div class="row" style="margin-top:10px"><span class="coin">🪙 ${r.cost}</span><button class="btn secondary" onclick="redeemReward(${i})">Đổi</button></div></div>`).join('')}</div><div class="section-title"><h3>Lịch sử game</h3></div><div class="card">${state.gameHistory.slice(-8).reverse().map(g=>`<div class="list-card"><div><b>${g.type} · ${g.subject}</b><div class="small muted">${new Date(g.date).toLocaleString('vi-VN')}</div></div><span>+${g.coins} xu · +${g.xp} XP</span></div>`).join('')||'<div class="muted">Chưa chơi game nào.</div>'}</div></div>`}
const rewards=[{name:'Áo polo UEH',desc:'Quà mô phỏng theo mẫu đồng phục UEH bạn cung cấp',cost:500,img:'assets/reward-ueh-polo.png'},{name:'Sổ tay UEH',desc:'Sổ tay học tập mang nhận diện UEH',cost:320,img:'assets/reward-ueh-notebook.png'},{name:'Móc khóa UEH',desc:'Phụ kiện nhận diện UEH',cost:250,img:'assets/reward-ueh-keychain.png'},{name:'Túi tote UEH',desc:'Túi đựng giáo trình và tài liệu',cost:420,img:'assets/reward-ueh-tote.png'}];
function redeemReward(i){const r=rewards[i];if(state.coins<r.cost)return toast('Bạn chưa đủ xu');state.coins-=r.cost;save();toast(`Đã đổi ${r.name}`);renderGames()}

function openFlash(){const cards=qbank[currentSubject].slice(0,10).map(q=>({front:q[0],back:q[1][q[2]]}));let i=0;showModal(`<h2>🃏 Flashcard Battle · ${currentSubject}</h2><div id="flashArea"></div><div class="row" style="margin-top:12px"><button class="btn ghost" onclick="flashMove(-1)">←</button><span id="flashCount">1/10</span><button class="btn" onclick="flashMove(1)">→</button></div>`);window.flashCards=cards;window.flashIndex=0;renderFlash()}

function normalizeQuestion(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}
function localGroupAnswer(subject,q){const n=normalizeQuestion(q);const hit=(groupFaq[subject]||[]).find(([re])=>re.test(n)||re.test(q.toLowerCase()));if(hit)return hit[1];return `Mình chưa thấy câu hỏi này trong bộ câu hỏi nhanh của nhóm ${subject}. Bạn viết lại theo dạng “khái niệm + nội dung cần hỏi” (ví dụ: “${subject} – giải thích …”) để nhóm trả lời đúng trọng tâm nhé. Nếu Smart AI đã được kết nối, hệ thống sẽ dùng AI để trả lời chi tiết theo đúng môn.`}
function groupMessagesFor(subject){if(!state.groupMessagesBySubject||typeof state.groupMessagesBySubject!=='object')state.groupMessagesBySubject={};if(!Array.isArray(state.groupMessagesBySubject[subject]))state.groupMessagesBySubject[subject]=JSON.parse(JSON.stringify(groupSeed[subject]||[]));return state.groupMessagesBySubject[subject]}
function renderGroups(){const msgs=groupMessagesFor(currentSubject);save();document.getElementById('content').innerHTML=`<div class="page">${homeBack()}<h1 class="page-title">Hội nhóm học tập</h1><p class="muted">Cộng đồng sinh viên K52 theo từng môn · mỗi nhóm có nội dung trao đổi riêng.</p><div class="subject-tabs">${SUBJECTS.map(s=>`<button class="${s===currentSubject?'active':''}" onclick="currentSubject='${s}';renderGroups()">${s}</button>`).join('')}</div><div class="chat card" style="margin-top:14px"><aside class="history"><b>Nhóm K52</b>${SUBJECTS.map(s=>`<button class="${s===currentSubject?'active':''}" onclick="currentSubject='${s}';renderGroups()">👥 ${s} · K52</button>`).join('')}</aside><div class="chatmain"><div><b>${currentSubject} · K52</b><div class="small muted">Câu hỏi và cuộc trò chuyện được lưu riêng theo từng môn.</div></div><div class="messages" id="groupMessages">${msgs.map(m=>`<div class="bubble ${m.me?'me':'ai'}"><b>${esc(m.from)}</b><br>${esc(m.text)}</div>`).join('')}</div><div class="composer"><textarea id="groupInput" rows="2" placeholder="Đặt câu hỏi về ${currentSubject}..."></textarea><button class="btn" onclick="sendGroup()">Gửi</button></div></div></div></div>`}
async function sendGroup(){const e=document.getElementById('groupInput'),text=e.value.trim();if(!text)return;const msgs=groupMessagesFor(currentSubject);msgs.push({from:state.username,text,me:true});renderGroups();const box=document.getElementById('groupMessages');box.insertAdjacentHTML('beforeend',`<div class="bubble ai" id="groupThinking"><b>Nhóm K52</b><br>Đang xem câu hỏi…</div>`);box.scrollTop=box.scrollHeight;
 let answer='';let responder='';
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`Bạn đang ở nhóm học tập K52 của môn "${currentSubject}". Hãy trả lời chính xác, trực tiếp câu hỏi sau bằng tiếng Việt, ưu tiên công thức/quy tắc/ví dụ khi phù hợp. Không bịa dữ kiện. Nếu câu hỏi thuộc môn khác, hãy nói rõ và không đoán. Câu hỏi: ${text}`,course:currentSubject})});const d=await r.json();if(r.ok&&d.answer){answer=d.answer;responder='Smart AI · '+currentSubject;}}catch{}
 if(!answer){answer=localGroupAnswer(currentSubject,text);const memberBySubject={'Kinh tế vi mô':['Hà','Minh Anh','Quang'],'Toán ứng dụng':['Mai','Duy','An'],'Tiếng Anh tổng quát':['Linh','Vy','Khoa'],'Luật kinh doanh':['Thảo','Nam','Hân'],'Tư duy thiết kế':['Yến','Phúc','Trang']};const members=memberBySubject[currentSubject]||['Minh Anh','Hà','Quang'];responder=members[msgs.length%members.length];}
 document.getElementById('groupThinking')?.remove();msgs.push({from:responder,text:answer,me:false});save();renderGroups();}
function scoreToGpa(x){if(x>=8.5)return 4;if(x>=8)return 3.5;if(x>=7)return 3;if(x>=6.5)return 2.5;if(x>=5.5)return 2;if(x>=5)return 1.5;if(x>=4)return 1;return 0}
function calcScoreLive(){
 let total10=0,total4=0,n=0;
 const rows=[];
 SUBJECTS.forEach(s=>{
  const id=slug(s),ws=['a','b','c','d'].map(x=>+document.getElementById(x+'-'+id)?.value||0),vs=['av','bv','cv','dv'].map(x=>{const el=document.getElementById(x+'-'+id);return el&&el.value!==''?+el.value:null});
  const out=document.getElementById('scoreOut-'+id),weightSum=ws.reduce((a,b)=>a+b,0),entered=vs.reduce((a,v,i)=>a+(v!==null?ws[i]:0),0);
  if(weightSum!==100){if(out)out.textContent='—';rows.push({s,score:null,gpa:null});return}
  if(entered>0){const score=vs.reduce((a,v,i)=>a+(v!==null?v*ws[i]:0),0)/entered*100;state.scores[s]=score;const gp=scoreToGpa(score);if(out)out.textContent=score.toFixed(2)+'*';total10+=score;total4+=gp;n++;rows.push({s,score,gpa:gp})}
  else {if(out)out.textContent='—';rows.push({s,score:null,gpa:null})}
 });
 const eg=document.getElementById('overallGpa'),ea=document.getElementById('overall10');if(eg)eg.textContent=n?(total4/n).toFixed(2):'0.00';if(ea)ea.textContent=n?(total10/n).toFixed(2):'0.00';
 const sum=document.getElementById('scoreSummary5');
 if(sum)sum.innerHTML=rows.map(r=>`<div class="list-card"><div><b>${esc(r.s)}</b><div class="small muted">Điểm tổng hợp</div></div><div style="text-align:right"><b>${r.score==null?'—':r.score.toFixed(2)}</b><div class="small muted">GPA ${r.gpa==null?'—':r.gpa.toFixed(2)}</div></div></div>`).join('');
 save();
}

in="0" max="10" placeholder="Điểm cuối kỳ" oninput="calcScoreLive()"></div><button class="btn" style="margin-top:10px" onclick="calcScore('${s}')">Tính</button></div>`).join('')}</div></div>`;calcScoreLive()}

iv><div class="card">${visible.map(x=>`<div class="list-card"><input type="checkbox" ${x.done?'checked':''} onchange="toggleTodo(${x._i})"><div style="flex:1"><b class="${x.done?'muted':''}">${esc(x.text)}</b><div class="small muted">${esc(x.subject)} · hạn ${esc(x.due||'chưa đặt')}</div></div><span class="chip ${x.priority==='Cao'?'priority-high':x.priority==='Vừa'?'priority-med':'priority-low'}">${x.priority==='Cao'?'🔴 ':x.priority==='Vừa'?'🟡 ':'🟢 '}${esc(x.priority)}</span><button class="btn ghost" onclick="deleteTodo(${x._i})">🗑</button></div>`).join('')||'<div class="notice">Không có nhiệm vụ thuộc bộ lọc này.</div>'}</div></div>`}

function addTodo(){const text=document.getElementById('todoText').value.trim();if(!text)return;state.todos.unshift({text,subject:document.getElementById('todoSubject').value,priority:document.getElementById('todoPriority').value,due:document.getElementById('todoDue').value,done:false});save();renderTodo();toast('Đã thêm nhiệm vụ')}

function saveSettings(){state.username=document.getElementById('setName').value||state.username;state.role=document.getElementById('setRole').value||state.role;state.cohort=document.getElementById('setCohort').value||state.cohort;state.major=document.getElementById('setMajor').value||state.major;save();updateHeader();toast('Đã lưu thay đổi');go(current)}
async function toggleDeadlineNotify(on){state.notifyDeadline=on;save();if(on&&'Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch{}}scheduleNotifications();toast(on?'Đã bật nhắc deadline':'Đã tắt nhắc deadline')}
function toggleGameNotify(on){state.notifyGame=on;save();scheduleNotifications();toast(on?'Đã bật nhắc nhiệm vụ game':'Đã tắt nhắc nhiệm vụ game')}
function scheduleNotifications(){
 if(!('Notification' in window)||Notification.permission!=='granted') return;
 const now=Date.now();
 if(state.notifyDeadline){
  state.deadlines.forEach(x=>{
   const at=new Date(x.date+'T08:00:00').getTime();
   const key='notified-'+x.date+'-'+x.title;
   if(at>now && at-now<7*86400000 && !sessionStorage.getItem(key)){
    setTimeout(()=>{new Notification('Smart Student · Deadline',{body:x.title+' · '+x.subject+' · '+x.date,icon:'/assets/ueh-logo.jpg'});sessionStorage.setItem(key,'1')},at-now);
   }
  });
 }
 if(state.notifyGame&&!sessionStorage.getItem('game-reminder-today')){
  const tomorrow=new Date();tomorrow.setHours(20,0,0,0);if(tomorrow.getTime()<now)tomorrow.setDate(tomorrow.getDate()+1);
  setTimeout(()=>{new Notification('Smart Student · Nhiệm vụ game',{body:'Hãy hoàn thành thử thách hôm nay để nhận XP và xu!',icon:'/assets/ueh-logo.jpg'});sessionStorage.setItem('game-reminder-today','1')},Math.max(1000,tomorrow.getTime()-now));
 }
}

function translatePage(){if(state.lang!=='en')return;const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(n=>{let v=n.nodeValue;Object.keys(uiEn).sort((a,b)=>b.length-a.length).forEach(k=>{v=v.split(k).join(uiEn[k])});n.nodeValue=v});document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(e=>{Object.keys(uiEn).sort((a,b)=>b.length-a.length).forEach(k=>{if(e.placeholder.includes(k))e.placeholder=e.placeholder.split(k).join(uiEn[k])})})}
function applyTheme(){document.documentElement.classList.toggle('dark',state.theme==='dark');document.documentElement.lang=state.lang;setTimeout(translatePage,0)}

function makeWordSearch(words){
 const size=12,grid=Array.from({length:size},()=>Array(size).fill(''));
 const clean=w=>normalizeText(w).replace(/\s+/g,'');
 const placed=[];
 const dirs=[[0,1],[1,0]];
 const used=new Set();
 const canPlace=(word,r,c,dr,dc)=>{
  const er=r+dr*(word.length-1),ec=c+dc*(word.length-1);
  if(er<0||er>=size||ec<0||ec>=size)return false;
  for(let i=0;i<word.length;i++){
   const rr=r+dr*i,cc=c+dc*i,ch=grid[rr][cc];
   if(ch && ch!==word[i])return false;
  }
  return true;
 };
 const place=(word,r,c,dr,dc)=>{
  for(let i=0;i<word.length;i++)grid[r+dr*i][c+dc*i]=word[i];
  const er=r+dr*(word.length-1),ec=c+dc*(word.length-1);
  placed.push({word,display:word, start:[r,c],end:[er,ec]});
 };
 words.map(clean).filter(Boolean).sort((a,b)=>b.length-a.length).forEach(word=>{
  let done=false;
  for(let attempt=0;attempt<500&&!done;attempt++){
   const [dr,dc]=dirs[Math.floor(Math.random()*dirs.length)];
   const r=Math.floor(Math.random()*size),c=Math.floor(Math.random()*size);
   if(canPlace(word,r,c,dr,dc) && !used.has(word)){place(word,r,c,dr,dc);used.add(word);done=true}
  }
  if(!done){
   outer: for(let r=0;r<size;r++)for(let c=0;c<size;c++)for(const [dr,dc] of dirs){
    if(canPlace(word,r,c,dr,dc)){place(word,r,c,dr,dc);done=true;break outer}
   }
  }
 });
 const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
 for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(!grid[r][c])grid[r][c]=letters[Math.floor(Math.random()*letters.length)];
 return {grid,placed};
}

 function posText(x){return `Hàng ${x.start[0]+1}, cột ${x.start[1]+1} → hàng ${x.end[0]+1}, cột ${x.end[1]+1}`}

t}.`}
function openSubjectCase(){const d=RIDDLE_DATA[currentSubject],st={i:0,time:180,answers:[],timerId:null,submitted:false};function submit(){if(st.submitted)return;const currentValue=document.getElementById('riddleV23')?.value?.trim();if(currentValue!==undefined)st.answers[st.i]=currentValue||null;st.submitted=true;clearInterval(st.timerId);const entries=d.rounds.map((r,i)=>{const user=st.answers[i]??null,ok=user!==null&&normalizeText(user)===normalizeText(r.answer);return {question:`Dựa vào 3 hình: ${r.pics.join(' + ')}`,user,answer:r.answer,correct:ok,explanation:riddleExplanation(r),solution:`Tách từng hình thành từ khóa, ghép các liên tưởng theo đúng gợi ý và đối chiếu với khái niệm “${r.answer}”.`,mistake:ok?'Không có lỗi ở câu này.':user?`Bạn nhập “${user}”, chưa khớp với khái niệm ${r.answer}. Hãy tách từng hình thành một ý rồi ghép nghĩa.`:'Bạn bỏ trống câu này; hãy luyện chuyển hình ảnh thành từ khóa và ghép nghĩa.'}});showGameDetailedReview('Game theo môn · Kết quả',currentSubject,entries,'subject')}function draw(){const r=d.rounds[st.i];showModal(`<div class="game-stage"><div class="row"><div><span class="game-mini">🖼️ GAME THEO MÔN</span><h2>${esc(d.title)} · ${esc(currentSubject)}</h2></div><b id="riddleTimer">03:00</b></div><p class="muted">Có thể nộp bài sớm ngay cả khi chưa điền. Không có đáp án A–B–C–D.</p><div class="small muted">Câu ${st.i+1}/${d.rounds.length}</div><div class="riddle-images">${r.pics.map((p,j)=>`<div class="riddle-pic"><div><div>${p}</div><div class="small muted">Hình ${j+1}</div></div></div>`).join('')}</div><input id="riddleV23" class="input" style="width:100%;text-transform:uppercase" placeholder="Nhập khái niệm..."><div class="row" style="margin-top:10px"><button class="btn" onclick="window.__riddleV23NextSave()">Lưu & câu tiếp</button><button class="btn secondary" onclick="window.__riddleV23Submit()">Nộp bài</button></div><div class="small muted" style="margin-top:8px">Gợi ý: ${esc(r.hint)}</div></div>`)}window.__riddleV23Submit=submit;window.__riddleV23NextSave=()=>{if(st.submitted)return;st.answers[st.i]=document.getElementById('riddleV23')?.value?.trim()||null;if(st.i>=d.rounds.length-1)submit();else{st.i++;draw()}};function riddleExplanation(r){return `Bước 1: nhận diện từ khóa từ hình ${r.pics[0]}; bước 2: đối chiếu hình ${r.pics[1]} và ${r.pics[2]}; bước 3: dùng gợi ý “${r.hint}” để ghép thành khái niệm “${r.answer}”.`}draw();clearInterval(st.timerId);st.timerId=setInterval(()=>{st.time--;const e=document.getElementById('riddleTimer');if(e){const sec=Math.max(0,st.time),m=Math.floor(sec/60),ss=String(sec%60).padStart(2,'0');e.textContent=`${m}:${ss}`}if(st.time<=0)submit()},1000)}
function dailyWordHints(l){
 const words=String(l.answer||'').trim().split(/\s+/).filter(Boolean);
 return words.map((w,i)=>{
  const initial=normalizeText(w).charAt(0)||'?';
  if(words.length===1) return `Gợi ý: ${l.codeHint||'Dùng manh mối của câu hỏi để suy ra thuật ngữ.'} Chữ cái đầu: ${initial}.`;
  return `Gợi ý từ ${i+1}: xác định từ khóa thứ ${i+1} trong cụm đáp án. ${l.codeHint||'Đối chiếu với câu hỏi và manh mối.'} Chữ cái đầu: ${initial}.`;
 });
}
function openDailyChallenge(){
 const d=DAILY_DATA[currentSubject],st={idx:0,started:Date.now(),timerId:null,opened:[]};
 function lockReview(title){
  const total=d.locks.length,score=st.opened.filter(Boolean).length,r=gameAbilityReport(currentSubject,score,total);
  const details=d.locks.map((l,i)=>`<div class="card review-item ${st.opened[i]?'review-good':'review-bad'}"><div class="row"><b>Ổ khóa ${i+1}</b><span class="chip">${st.opened[i]?'✅ Đúng':'❌ Chưa mở'}</span></div><p><b>Câu hỏi:</b> ${esc(l.question)}</p><p><b>Manh mối:</b> ${esc(l.clue)}</p><p><b>Đọc sơ đồ:</b> ${esc(l.map.join(' → '))}</p><p><b>Giải mật mã:</b> Đã kiểm tra theo các khóa tương ứng với số từ của đáp án.</p><p><b>Đáp án sau khi nộp:</b> <strong>${esc(l.answer)}</strong></p><p><b>Giải thích:</b> ${esc(l.explanation||`Sơ đồ và mật mã của ổ khóa này được xây dựng từ chính dữ kiện của câu hỏi.`)}</p><p><b>Lỗi & điểm cần cải thiện:</b> ${st.opened[i]?'Không có lỗi ở ổ khóa này.':`Bạn chưa mở được ổ khóa. Hãy đối chiếu câu hỏi với manh mối, đọc sơ đồ và dùng từng gợi ý khóa.`}</p></div>`).join('');
  showModal(`<div class="game-stage escape-room"><div class="game-mini">🧠 PHÂN TÍCH THỬ THÁCH HÀNG NGÀY</div><h2>${esc(title)}</h2><div class="card" style="border-left:6px solid ${r.color};margin:12px 0"><div class="small muted">Ổ KHÓA ĐÃ MỞ</div><div class="metric">${score}/${total} · ${Math.round(score/Math.max(total,1)*100)}%</div><div class="small muted">Mức năng lực: <b style="color:${r.color}">${esc(r.level)}</b></div><div class="progress"><span style="width:${Math.round(r.ratio*100)}%;background:${r.color}"></span></div></div><div class="card"><h3>🛠️ Cách cải thiện</h3><p>${esc(r.advice)}</p></div>${details}<button class="btn" onclick="hideModal();renderGames()">Về Game Center</button></div>`);
 }
 function lock(){
  if(st.idx>=d.locks.length){clearInterval(st.timerId);gameRewardV23('daily',d.locks.length,d.locks.length);lockReview('Thoát phòng thành công!');return}
  const l=d.locks[st.idx],hints=dailyWordHints(l),revealed=new Set();
  showModal(`<div class="game-stage escape-room"><div class="row"><div><span class="game-mini">🚪 THỬ THÁCH HÀNG NGÀY</span><h2>${esc(d.title)}</h2></div><b id="escapeV32Time">10:00</b></div><div class="escape-scene"><div style="text-align:center;font-size:60px">${l.icon}</div><div class="escape-card"><b>Ổ khóa ${st.idx+1}/${d.locks.length}</b><p><b>Câu hỏi:</b> ${esc(l.question)}</p><p class="muted"><b>Manh mối:</b> ${esc(l.clue)}</p><div class="clue-actions"><button type="button" onclick="window.__clueV32()">🔎 Tìm manh mối</button><button type="button" onclick="window.__mapV32()">🗺️ Đọc sơ đồ</button><button type="button" onclick="window.__codeV32()">🔐 Giải mật mã</button></div><div id="escapeV32Work"></div></div></div></div>`);
  window.__clueV32=()=>{document.getElementById('escapeV32Work').innerHTML=`<div class="notice"><b>Manh mối của chính câu hỏi này:</b> ${esc(l.clue)}</div><input id="escapeV32Input" class="input" style="width:100%;margin-top:8px" placeholder="Nhập đáp án"><button type="button" class="btn" style="margin-top:8px" onclick="window.__unlockV32()">Mở khóa</button>`};
  window.__mapV32=()=>{document.getElementById('escapeV32Work').innerHTML=`<div class="mini-map">${l.map.map(x=>`<span>${esc(x)}</span>`).join('<b>→</b>')}</div><p class="small muted"><b>Sơ đồ này được tạo cho câu hỏi hiện tại:</b> ${esc(l.question)}</p><input id="escapeV32Input" class="input" style="width:100%" placeholder="Nhập đáp án từ sơ đồ"><button type="button" class="btn" style="margin-top:8px" onclick="window.__unlockV32()">Mở khóa</button>`};
  window.__codeV32=()=>{document.getElementById('escapeV32Work').innerHTML=`<p class="small muted"><b>Giải mật mã:</b> Mỗi ô khóa tương ứng với <strong>${hints.length}</strong> từ trong đáp án. Không hiển thị đáp án ở bước này.</p><div class="escape-code-panel">${hints.map((h,i)=>`<button type="button" class="escape-lock-btn ${revealed.has(i)?'revealed':''}" onclick="window.__revealCodeHintV32(${i})"><span style="font-size:28px">🔒</span><span>Khóa ${i+1}</span></button>`).join('')}</div><div id="codeHintsV32"></div><input id="escapeV32Input" class="input" style="width:100%;margin-top:10px" placeholder="Nhập đáp án đã giải mã"><button type="button" class="btn" style="margin-top:8px" onclick="window.__unlockV32()">Giải mã & mở khóa</button>`};
  window.__revealCodeHintV32=i=>{revealed.add(i);document.getElementById('codeHintsV32').innerHTML=Array.from(revealed).sort((a,b)=>a-b).map(j=>`<div class="code-hint">🔓 <b>Gợi ý khóa ${j+1}:</b> ${esc(hints[j])}</div>`).join('')};
  window.__unlockV32=()=>{const value=normalizeText(document.getElementById('escapeV32Input')?.value);if(value===normalizeText(l.answer)){st.opened[st.idx]=true;st.idx++;lock()}else toast('Chưa đúng — hãy bám sát đúng câu hỏi, manh mối, sơ đồ hoặc gợi ý của từng khóa.')};
 }
 clearInterval(st.timerId);st.timerId=setInterval(()=>{const sec=Math.max(0,600-Math.floor((Date.now()-st.started)/1000)),m=Math.floor(sec/60),ss=String(sec%60).padStart(2,'0'),e=document.getElementById('escapeV32Time');if(e)e.textContent=`${m}:${ss}`;if(sec<=0){clearInterval(st.timerId);lockReview('Thử thách hằng ngày · Hết thời gian')}},1000);lock();
}
function gameRewardV23(type,score,total){const ratio=total?score/total:1;const coins=Math.max(6,Math.round(10+ratio*20)),xp=Math.max(8,Math.round(12+ratio*28));addReward(coins,xp,type,currentSubject,score);return {coins,xp}}

function renderInit(){hydrateMascot();renderNavAnd();go('home')}
applyTheme();renderInit();scheduleNotifications();
</script>
